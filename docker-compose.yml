version: "3.8"
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - MONGO_URI=mongodb://mongo:27017/sayana-db
      - JWT_SECRET=dev-secret-change
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - ./sayana-backend:/usr/src/app:ro

  frontend:
    image: node:18-alpine
    working_dir: /usr/src/front
    volumes:
      - ./sayana-frontend:/usr/src/front
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
